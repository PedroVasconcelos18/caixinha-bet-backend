spring:
  application:
    name: caixinha-bet-backend

  datasource:
    # Lido de variáveis de ambiente (ver .env.example). Sem segredos no repo.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:caixinhabet}
    username: ${DB_USER:caixinhabet}
    password: ${DB_PASSWORD:caixinhabet}

  jpa:
    hibernate:
      # Flyway é o ÚNICO dono do schema. O Hibernate NUNCA cria/altera tabela.
      # 'validate' falha o boot se o schema divergir das entidades (AR-9, NFR-1).
      ddl-auto: validate
    properties:
      hibernate:
        # Naming físico snake_case: domínio/API em camelCase, Postgres em
        # snake_case, conversão SÓ aqui na borda do JPA (AR-8).
        physical_naming_strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Schema versionado desde o baseline vazio (V1) — sem baseline-on-migrate.

  mvc:
    problemdetails:
      # Erros do Spring MVC (404, 415, validation, etc.) respondem como
      # application/problem+json (RFC 9457) — corretude de contrato por
      # construção (AR-8). Story 1.3 + GlobalExceptionHandler complementam
      # para exceções de domínio.
      enabled: true

  servlet:
    # Minha Conta (2026-05): upload de foto via multipart. Limite de 3 MB
    # (folga acima do limite de 2 MB do domínio Foto), para que o multipart
    # wrapper não rejeite antes do nosso handler — a mensagem fica nossa.
    multipart:
      enabled: true
      max-file-size: 3MB
      max-request-size: 3MB

  # Mail (Story 2.4). Em dev fica vazio (sender=log); em produção configurar
  # via env (SMTP_HOST/PORT/USER/PASSWORD).
  # Provedor escolhido: Resend (smtp.resend.com:465, SSL, user literal
  # `resend`, password = API key gerada em resend.com/api-keys).
  # `EMAIL_FROM` precisa estar em domínio verificado em resend.com/domains —
  # senão o envio é rejeitado pelo provedor.
  mail:
    host: ${SMTP_HOST:}
    # 465 = SMTPS implícito (SSL). É a porta que o Resend recomenda e que
    # PaaS (Railway/Render/Fly) deixa sair — a 587 costuma ser bloqueada de
    # saída (anti-spam) e dá "Connection timed out". Em 465 NÃO usar STARTTLS.
    port: ${SMTP_PORT:465}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          # SSL implícito on (casa com 465). starttls off para não quebrar o
          # handshake. Para 587+STARTTLS: SMTP_SSL=false e SMTP_STARTTLS=true.
          ssl:
            enable: ${SMTP_SSL:true}
          starttls:
            enable: ${SMTP_STARTTLS:false}
          # Falha rápida em vez de pendurar a request/thread se a porta estiver
          # bloqueada (ms). Sender é best-effort: timeout vira log, não 500.
          connectiontimeout: ${SMTP_TIMEOUT_MS:10000}
          timeout: ${SMTP_TIMEOUT_MS:10000}
          writetimeout: ${SMTP_TIMEOUT_MS:10000}

# Configuração do app (Story 2.1).
# public-base-url é a URL do FRONT (não da API). O magic link enviado por
# e-mail aponta para `${app.public-base-url}/auth/callback?token=...`; a
# página do front em /auth/callback faz fetch para a API e recebe o cookie
# de sessão. Em produção: HTTPS do domínio público. Em dev: http://localhost:3000.
app:
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:3000}

# Configuração do módulo auth (Story 2.1).
# - ttl-minutos: tempo de vida do magic link. 15 min é o trade-off
#   conveniência (não cabe o usuário esperar) vs. exposição (link comprometido
#   curto-circuita rápido). FR-16 não fixa valor; arquitetura também não.
# - sender: estratégia de envio. "log" = LogMagicLinkSender (loga URL no
#   console — o adapter ativo no MVP até a Story 2.4 trazer SMTP). Qualquer
#   outro valor falha o boot (defesa: produção não pode bootar com sender=log).
# - sessao.ttl-dias: duração do cookie de sessão. 7 dias casa com o Max-Age
#   do Set-Cookie. SessaoStore in-memory expira atomicamente.
auth:
  magic-link:
    ttl-minutos: 15
    # Story 2.4: ampliado para aceitar "smtp" (SmtpMagicLinkSender ativo).
    # Default "log" (LogMagicLinkSender). Em produção: setar AUTH_MAGIC_LINK_SENDER=smtp.
    sender: ${AUTH_MAGIC_LINK_SENDER:log}
    email-from: ${EMAIL_FROM:noreply@caixinhabet.com}
  sessao:
    ttl-dias: 7

# Configuração do módulo caixinha (Stories 2.4 + 3.1).
# convite.sender: "log" (default — LogConviteEmailSender, dev) ou "smtp"
# (SmtpConviteEmailSender, produção). CaixinhaBootGuard valida no boot.
# minimo-atingido.sender: aviso "Mínimo atingido! Hora de pagar" disparado
# quando a Caixinha transiciona coletando_convites→coletando_pagamentos
# (Story 3.1, FR-6). Mesma disciplina log/smtp do convite.
caixinha:
  convite:
    sender: ${CAIXINHA_CONVITE_SENDER:log}
    email-from: ${EMAIL_FROM:noreply@caixinhabet.com}
  minimo-atingido:
    sender: ${CAIXINHA_MINIMO_ATINGIDO_SENDER:log}
    email-from: ${EMAIL_FROM:noreply@caixinhabet.com}
  # Story 3.4: aviso de Formação / Reversão da Caixinha (FR-9).
  formacao:
    sender: ${CAIXINHA_FORMACAO_SENDER:log}
    email-from: ${EMAIL_FROM:noreply@caixinhabet.com}
  # Story 3.6: job de reconciliação contra o extrato do Provedor (NFR-2).
  # intervalo-ms: período entre rodadas (fixedDelay — conta do fim da
  # rodada anterior). atraso-inicial-ms: espera antes da 1ª rodada (deixa
  # o app subir). Default 5 min / 1 min.
  reconciliacao:
    intervalo-ms: ${CAIXINHA_RECONCILIACAO_INTERVALO_MS:300000}
    atraso-inicial-ms: ${CAIXINHA_RECONCILIACAO_ATRASO_INICIAL_MS:60000}
  # Story 4.3: aviso "você ganhou" ao Ganhador no momento da apuração.
  premio-ganho:
    sender: ${CAIXINHA_PREMIO_GANHO_SENDER:log}
    email-from: ${EMAIL_FROM:noreply@caixinhabet.com}
  # Story 5.1: aviso de cancelamento da Caixinha (FR-11).
  cancelamento:
    sender: ${CAIXINHA_CANCELAMENTO_SENDER:log}
    email-from: ${EMAIL_FROM:noreply@caixinhabet.com}

# Configuração do PSP (Story 1.4).
# Sandbox por default (R-7 mitigação: trocabilidade de ambiente sem código).
# Story 1.5 valida o gate; outras stories continuam usando esta seção.
asaas:
  # API sandbox confirmada com chave de homologação real do Pedro em
  # 2026-05-19: https://sandbox.asaas.com/api/v3 (não api-sandbox.asaas.com).
  # Note que o /api/v3 já está embutido na base-url, então o adapter chama
  # endpoints sem prefixo (POST /payments, GET /payments/{id}/pixQrCode).
  base-url: ${ASAAS_BASE_URL:https://sandbox.asaas.com/api/v3}
  access-token: ${ASAAS_ACCESS_TOKEN:}
  webhook-auth-token: ${ASAAS_WEBHOOK_AUTH_TOKEN:}

management:
  endpoints:
    web:
      exposure:
        # Apenas health exposto no MVP (observabilidade/reconciliação evoluem
        # nos épicos financeiros). Endpoints sensíveis ficam fechados.
        include: health
  endpoint:
    health:
      # 'db' aparece nos componentes do health (Postgres é dependência dura).
      show-components: always
  health:
    # Story 2.4: SMTP não é dependência DURA do app (envio é best-effort
    # pós-commit). Health do app NÃO deve cair só porque SMTP está
    # indisponível. Em dev local com SMTP_HOST vazio o indicator default
    # reporta DOWN; desligar evita falso negativo.
    mail:
      enabled: false
